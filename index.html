<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="https://rbrdingenierie-ui.github.io/accueil_outils/favicon.svg">
<link rel="apple-touch-icon" href="https://rbrdingenierie-ui.github.io/accueil_outils/favicon.svg">
<title>À bientôt !</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-soft: #4A5C82;
    --gold: #B08D57;
    --orange: #E0591F;
    --teal: #12796B;
    --teal-soft: #E3F3F1;
    --bg: #F7F8FA;
    --white: #FFFFFF;
    --track: #8592B0;
    --a11y-scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); font-family: Arial, Helvetica, sans-serif; color: var(--navy); }
  body { display:flex; justify-content:center; padding: 32px 16px 60px; }
  .page { width:100%; max-width: 640px; }

  header { text-align:center; margin-bottom: 20px; }
  header h1 { font-size: calc(clamp(24px, 5vw, 30px) * var(--a11y-scale)); margin: 0 0 8px 0; }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--navy) !important; outline-offset: 2px; }

  .skip-link {
    position:absolute; left:-9999px; top:0; z-index:1000;
    background:var(--navy); color:#FFFFFF; font-family:inherit; font-weight:700; font-size:14px;
    padding:12px 20px; border-radius:0 0 10px 0; text-decoration:none;
  }
  .skip-link:focus { left:0; }

  .a11y-bar {
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    background: var(--white); border:2px solid var(--track); border-radius:14px;
    padding: 12px 16px; margin-bottom: 24px;
  }
  .a11y-bar-label { font-size:13px; font-weight:800; color: var(--navy); margin-right:4px; }
  .a11y-toggle-btn {
    font-family:inherit; font-size:13px; font-weight:700; color: var(--navy-soft);
    background: var(--white); border:2px solid var(--track); border-radius:999px;
    padding: 8px 14px; cursor:pointer;
  }
  .a11y-toggle-btn:hover { border-color: var(--navy-soft); }
  .a11y-toggle-btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color:#FFFFFF; }
  .a11y-size-group { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color: var(--navy); }
  .a11y-size-group button {
    font-family:inherit; font-weight:800; font-size:14px; color: var(--navy);
    background: var(--white); border:2px solid var(--navy-soft); border-radius:8px;
    width:34px; height:34px; cursor:pointer;
  }
  .a11y-size-group button:hover { border-color: var(--navy); }

  body.a11y-font, body.a11y-font * { font-family: Verdana, Geneva, sans-serif !important; }

  .falc-simple-content { display:none; }
  body.falc-mode .falc-normal-content { display:none; }
  body.falc-mode .falc-simple-content { display:block; }
  .falc-simple-content p { font-size: calc(16px * var(--a11y-scale)); line-height: 2; color:#000000; }

  body.a11y-contrast { background:#FFFFFF; }
  body.a11y-contrast .page { color:#000000; }
  body.a11y-contrast .a11y-bar, body.a11y-contrast .panel { border-color:#000000 !important; }
  body.a11y-contrast .recap-text { color:#000000 !important; }

  .tts-btn {
    display:block; margin:0 auto 22px; font-family:inherit; font-size:calc(13.5px * var(--a11y-scale)); font-weight:700;
    color:var(--teal); background:var(--teal-soft); border:2px solid var(--teal); border-radius:999px;
    padding:10px 20px; cursor:pointer; min-height:24px;
  }
  .tts-btn:hover { background:var(--teal); color:#FFFFFF; }
  .tts-btn[aria-pressed="true"] { background:var(--teal); color:#FFFFFF; }
  .tts-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .mentor-zone { text-align:center; margin-bottom:22px; }
  .mentor-char { width:180px; max-width:55%; margin:0 auto 14px; }
  .mentor-char svg { width:100%; height:auto; display:block; }
  .mentor-sparkle {
    opacity:0.35; transform-origin:center; transform-box:fill-box;
    animation:mentor-sparkle-twinkle 2s ease-in-out infinite;
  }
  .mentor-sparkle-1 { animation-delay:0s; }
  .mentor-sparkle-2 { animation-delay:0.35s; }
  .mentor-sparkle-3 { animation-delay:0.7s; }
  .mentor-sparkle-4 { animation-delay:1.05s; }
  .mentor-sparkle-5 { animation-delay:0.5s; }
  .mentor-sparkle-6 { animation-delay:0.85s; }
  .mentor-sparkle-7 { animation-delay:1.2s; }
  .mentor-sparkle-8 { animation-delay:1.5s; }
  .mentor-sparkle-9 { animation-delay:1.75s; }
  @keyframes mentor-sparkle-twinkle {
    0%, 100% { opacity:0.25; transform:scale(0.75); }
    50% { opacity:1; transform:scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce) { .mentor-sparkle { animation:none; opacity:0.85; } }

  .mentor-head-group {
    transform-box:view-box; transform-origin:340px 330px;
    animation:mentor-head-talk 4s ease-in-out infinite;
  }
  @keyframes mentor-head-talk {
    0%, 100% { transform:rotate(0deg); }
    25% { transform:rotate(-6deg); }
    75% { transform:rotate(6deg); }
  }
  .mentor-hand-wave {
    transform-box:view-box; transform-origin:440px 368px;
    animation:mentor-hand-talk 4s ease-in-out infinite;
  }
  @keyframes mentor-hand-talk {
    0%, 100% { transform:rotate(0deg); }
    30% { transform:rotate(-16deg); }
    70% { transform:rotate(13deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mentor-head-group, .mentor-hand-wave { animation:none; }
  }

  .farewell-message {
    font-size:calc(17px * var(--a11y-scale)); color:var(--navy); font-weight:700; line-height:1.6;
    max-width:480px; margin:0 auto; padding:0 8px; text-wrap:balance;
  }

  .panel {
    background:var(--white); border:2px solid var(--track); border-radius:18px; padding:22px; margin-bottom:20px; text-align:center;
  }
  .recap-title { font-size:calc(15px * var(--a11y-scale)); font-weight:800; color:var(--navy); margin-bottom:10px; }
  .recap-text { font-size:calc(14px * var(--a11y-scale)); color:var(--navy-soft); line-height:1.6; }
  .recap-badges { font-size:calc(22px * var(--a11y-scale)); font-weight:800; color:var(--gold); margin:6px 0; }

  .reconnect-btn {
    display:block; width:100%; text-align:center; font-family:inherit; font-size:calc(15.5px * var(--a11y-scale)); font-weight:700;
    color:#FFFFFF; background:var(--navy); border:none; border-radius:14px; padding:16px; cursor:pointer;
    text-decoration:none; min-height:24px;
  }
  .reconnect-btn:hover { filter:brightness(1.15); }

  footer { text-align:center; font-size:calc(12px * var(--a11y-scale)); color: var(--navy-soft); margin-top: 26px; }
</style>
</head>
<body>

<div class="page">
  <div class="a11y-bar" role="region" aria-label="Options d'accessibilité">
    <span class="a11y-bar-label">♿ Accessibilité</span>
    <button type="button" id="a11yFontBtn" class="a11y-toggle-btn" aria-pressed="false">🔤 Police adaptée</button>
    <button type="button" id="a11yContrastBtn" class="a11y-toggle-btn" aria-pressed="false">◐ Contraste renforcé</button>
    <button type="button" id="falcModeBtn" class="a11y-toggle-btn" aria-pressed="false" title="Facile à Lire et à Comprendre : simplifie le texte de la page">📖 Mode FALC</button>
    <button type="button" id="hoverReadBtn" class="a11y-toggle-btn" aria-pressed="false" title="Lit à voix haute le contenu de la page quand la souris passe dessus">🔊 Lecture au survol</button>
    <div class="a11y-size-group" role="group" aria-label="Taille du texte">
      <span>Taille du texte</span>
      <button type="button" id="a11ySizeDown" aria-label="Réduire la taille du texte">A−</button>
      <button type="button" id="a11ySizeReset" aria-label="Taille du texte par défaut">A</button>
      <button type="button" id="a11ySizeUp" aria-label="Agrandir la taille du texte">A+</button>
    </div>
  </div>

  <main id="main" tabindex="-1">
  <header>
    <h1><span aria-hidden="true">👋</span> À bientôt !</h1>
  </header>

  <div class="mentor-zone">
    <div class="mentor-char" aria-hidden="true">
      <svg viewBox="0 0 680 620">
        <path class="mentor-sparkle mentor-sparkle-1" d="M100 80 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9 z" fill="#B08D57"/>
        <path class="mentor-sparkle mentor-sparkle-2" d="M580 110 l8 21 21 8 -21 8 -8 21 -8 -21 -21 -8 21 -8 z" fill="#168F7F"/>
        <path class="mentor-sparkle mentor-sparkle-3" d="M70 330 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#E0591F"/>
        <path class="mentor-sparkle mentor-sparkle-4" d="M600 360 l8 21 21 8 -21 8 -8 21 -8 -21 -21 -8 21 -8 z" fill="#B08D57"/>
        <path class="mentor-sparkle mentor-sparkle-5" d="M140 500 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#168F7F"/>
        <path class="mentor-sparkle mentor-sparkle-6" d="M560 500 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#C0392B"/>
        <path class="mentor-sparkle mentor-sparkle-7" d="M30 220 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z" fill="#8A5CB0"/>
        <path class="mentor-sparkle mentor-sparkle-8" d="M630 240 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#E0591F"/>
        <path class="mentor-sparkle mentor-sparkle-9" d="M90 450 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#168F7F"/>
        <use href="#mentorChar"/>
      </svg>
    </div>
    <div class="falc-normal-content"><p class="farewell-message" id="farewellNormal"></p></div>
    <div class="falc-simple-content"><p class="farewell-message" id="farewellSimple"></p></div>
  </div>

  <div class="panel" id="recapPanel" hidden>
    <div class="recap-title">🏅 Votre progression</div>
    <div class="recap-badges" id="recapBadgesCount"></div>
    <p class="recap-text">Revenez bientôt pour en débloquer davantage !</p>
  </div>

  <a href="https://rbrdingenierie-ui.github.io/menu_revision/" class="reconnect-btn">🔑 Me reconnecter</a>

  <footer>Benjamin RICHARD - Tous droits réservés</footer>
  </main>
</div>

<script>
(function () {
  // ---- barre d'accessibilite ----
  const A11Y_PREFS_KEY = 'deconnexion-a11y-prefs-v1';
  let a11yPrefs = { font: false, contrast: false, scale: 1, falc: false, hoverRead: false };
  try {
    const rawPrefs = localStorage.getItem(A11Y_PREFS_KEY);
    if (rawPrefs) a11yPrefs = Object.assign(a11yPrefs, JSON.parse(rawPrefs));
  } catch (e) {}
  function saveA11yPrefs() {
    try { localStorage.setItem(A11Y_PREFS_KEY, JSON.stringify(a11yPrefs)); } catch (e) {}
  }
  function applyA11yPrefs() {
    document.body.classList.toggle('a11y-font', a11yPrefs.font);
    document.body.classList.toggle('a11y-contrast', a11yPrefs.contrast);
    document.body.classList.toggle('falc-mode', a11yPrefs.falc);
    document.documentElement.style.setProperty('--a11y-scale', a11yPrefs.scale);
    document.getElementById('a11yFontBtn').setAttribute('aria-pressed', a11yPrefs.font ? 'true' : 'false');
    document.getElementById('a11yContrastBtn').setAttribute('aria-pressed', a11yPrefs.contrast ? 'true' : 'false');
    document.getElementById('falcModeBtn').setAttribute('aria-pressed', a11yPrefs.falc ? 'true' : 'false');
    document.getElementById('hoverReadBtn').setAttribute('aria-pressed', a11yPrefs.hoverRead ? 'true' : 'false');
  }
  document.getElementById('a11yFontBtn').addEventListener('click', () => { a11yPrefs.font = !a11yPrefs.font; applyA11yPrefs(); saveA11yPrefs(); });
  document.getElementById('a11yContrastBtn').addEventListener('click', () => { a11yPrefs.contrast = !a11yPrefs.contrast; applyA11yPrefs(); saveA11yPrefs(); });
  document.getElementById('falcModeBtn').addEventListener('click', () => {
    a11yPrefs.falc = !a11yPrefs.falc;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    applyA11yPrefs(); saveA11yPrefs();
  });
  document.getElementById('hoverReadBtn').addEventListener('click', () => {
    a11yPrefs.hoverRead = !a11yPrefs.hoverRead;
    if (!a11yPrefs.hoverRead && window.speechSynthesis) window.speechSynthesis.cancel();
    applyA11yPrefs(); saveA11yPrefs();
  });
  document.getElementById('a11ySizeUp').addEventListener('click', () => { a11yPrefs.scale = Math.min(1.6, Math.round((a11yPrefs.scale + 0.15) * 100) / 100); applyA11yPrefs(); saveA11yPrefs(); });
  document.getElementById('a11ySizeDown').addEventListener('click', () => { a11yPrefs.scale = Math.max(0.85, Math.round((a11yPrefs.scale - 0.15) * 100) / 100); applyA11yPrefs(); saveA11yPrefs(); });
  document.getElementById('a11ySizeReset').addEventListener('click', () => { a11yPrefs.scale = 1; applyA11yPrefs(); saveA11yPrefs(); });
  applyA11yPrefs();

  // ---- lecture au survol, sur l'integralite de la page ----
  function getVisibleHoverText(el) {
    const isFalc = document.body.classList.contains('falc-mode');
    if (isFalc && el.closest('.falc-normal-content')) return '';
    if (!isFalc && el.closest('.falc-simple-content')) return '';
    const clone = el.cloneNode(true);
    clone.querySelectorAll(isFalc ? '.falc-normal-content' : '.falc-simple-content').forEach(n => n.remove());
    clone.querySelectorAll('[aria-hidden="true"], .sr-only').forEach(n => n.remove());
    return clone.textContent.replace(/\s+/g, ' ').trim();
  }
  const hoverReadSupported = 'speechSynthesis' in window;
  function attachHoverRead(el) {
    if (!hoverReadSupported || el.dataset.hoverReadAttached) return;
    el.dataset.hoverReadAttached = '1';
    el.addEventListener('mouseenter', () => {
      if (!a11yPrefs.hoverRead) return;
      window.speechSynthesis.cancel();
      const text = getVisibleHoverText(el);
      if (!text) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'fr-FR'; utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    });
    el.addEventListener('mouseleave', () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); });
    el.addEventListener('focusin', () => { if (a11yPrefs.hoverRead) el.dispatchEvent(new Event('mouseenter')); });
    el.addEventListener('focusout', () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); });
  }
  const HOVER_READ_SELECTOR = 'h1, .farewell-message, .recap-title, .recap-badges, .recap-text, .reconnect-btn, .a11y-toggle-btn, .a11y-bar-label';
  function attachHoverReadAll(root) {
    (root || document).querySelectorAll(HOVER_READ_SELECTOR).forEach(attachHoverRead);
  }

  // ---- message d'au revoir, plusieurs variantes ----
  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  const FAREWELL_NORMAL = [
    "À bientôt, jeune chevalier de la révision !<br><br>Vous reposer, vous devez. Mais revenir, vous devrez aussi.",
    "Bien travaillé aujourd'hui, vous avez.<br><br>Prendre une pause, méritée elle est. À votre retour, je vous attendrai.",
    "Partir, vous devez, pour l'instant.<br><br>Mais la force de la révision, avec vous elle reste, même loin d'ici.",
    "Une pause bien méritée, voici.<br><br>Que la régularité vous guide jusqu'à votre prochaine visite."
  ];
  const FAREWELL_SIMPLE = [
    "À bientôt ! 👋<br><br>Reposez-vous bien.<br>Revenez quand vous voulez.",
    "Bon travail aujourd'hui !<br><br>Vous pouvez faire une pause.<br>À bientôt.",
    "Vous partez pour l'instant.<br><br>C'est bien, prenez une pause.<br>Revenez bientôt continuer."
  ];
  document.getElementById('farewellNormal').innerHTML = pickRandom(FAREWELL_NORMAL);
  document.getElementById('farewellSimple').innerHTML = pickRandom(FAREWELL_SIMPLE);

  // ---- recapitulatif de progression (si des badges ont deja ete debloques) ----
  try {
    const raw = localStorage.getItem('accueil-badges-debloques-v1');
    const unlocked = raw ? JSON.parse(raw) : [];
    if (unlocked.length > 0) {
      document.getElementById('recapBadgesCount').textContent = `${unlocked.length}/43 badges débloqués`;
      document.getElementById('recapPanel').hidden = false;
    }
  } catch (e) {}

  // attache la lecture au survol une fois tout le contenu dynamique rendu
  attachHoverReadAll();
})();
</script>

</body>
</html>
